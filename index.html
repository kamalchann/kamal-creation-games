<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Kamal Creation Games — Mini Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #080b12;
      --panel: #0e131d;
      --panel-raised: #121a27;
      --canvas: #090e17;
      --line: #202b3b;
      --text: #edf4ff;
      --muted: #8c9ab0;
      --green: #81ffb3;
      --green-bright: #a4ffc9;
      --pink: #ff5fba;
      --cyan: #66e6ff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: dark;
        --page: #0c111a;
        --panel: #121a25;
        --panel-raised: #192333;
        --canvas: #101a28;
        --line: #293548;
        --text: #edf4ff;
        --muted: #a0aec0;
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--green) 8%, transparent), transparent 42%),
        var(--page);
      font-size: 15px;
    }

    button { font: inherit; }

    .app {
      width: min(100%, 560px);
    }

    .game-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 0 0 12px;
      padding: 5px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .game-picker button {
      min-height: 38px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: color .15s ease, background .15s ease, border-color .15s ease;
    }

    .game-picker button:hover { color: var(--text); }
    .game-picker button[aria-pressed="true"] {
      color: var(--green);
      background: var(--panel-raised);
      border-color: var(--line);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 2px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--green);
      background: color-mix(in srgb, var(--green) 10%, var(--panel));
      border: 1px solid color-mix(in srgb, var(--green) 24%, transparent);
      border-radius: 12px;
      box-shadow: 0 0 24px color-mix(in srgb, var(--green) 10%, transparent);
    }

    .brand-mark svg { width: 20px; height: 20px; }
    h1 { margin: 0; font-size: 17px; font-weight: 680; letter-spacing: -.025em; }
    .eyebrow { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .045em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
    }

    .status[data-state="playing"] { color: var(--green); }
    .status[data-state="playing"] .status-dot { background: var(--green); box-shadow: 0 0 9px var(--green); }
    .status[data-state="paused"] { color: var(--cyan); }
    .status[data-state="paused"] .status-dot { background: var(--cyan); }

    .game-card {
      overflow: hidden;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 24px 70px #00000025, inset 0 1px #ffffff08;
    }

    .scorebar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 0 2px 14px;
    }

    .score-block:last-child { text-align: right; }
    .score-label { display: block; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .score-value { display: block; margin-top: 3px; font-size: 23px; font-weight: 720; line-height: 1; font-variant-numeric: tabular-nums; }
    #score { color: var(--green); }
    .level { padding: 7px 10px; color: var(--cyan); background: color-mix(in srgb, var(--cyan) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--cyan) 20%, transparent); border-radius: 9px; font-size: 12px; font-weight: 650; }

    .board-wrap {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1;
      background: var(--canvas);
      border: 1px solid #ffffff0d;
      border-radius: 12px;
      box-shadow: inset 0 0 42px #0000002a;
    }

    .board-wrap.wide { aspect-ratio: 4 / 3; }
    canvas { display: block; width: 100%; height: 100%; }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #070b12a8;
      backdrop-filter: blur(5px);
      text-align: center;
    }

    .overlay[hidden] { display: none; }
    .overlay-card { max-width: 280px; }
    .overlay-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      color: var(--green);
      background: #81ffb314;
      border: 1px solid #81ffb33a;
      border-radius: 17px;
    }
    .overlay-icon svg { width: 26px; height: 26px; }
    .overlay h2 { margin: 0; font-size: 23px; letter-spacing: -.035em; }
    .overlay p { margin: 8px 0 19px; color: #a2aec0; font-size: 14px; line-height: 1.55; }

    .primary {
      min-height: 42px;
      padding: 0 18px;
      color: #07120b;
      background: var(--green);
      border: 0;
      border-radius: 10px;
      box-shadow: 0 5px 20px #81ffb328;
      cursor: pointer;
      font-size: 14px;
      font-weight: 720;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .primary:hover { background: var(--green-bright); box-shadow: 0 7px 24px #81ffb344; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

    .helpbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 3px 1px;
      color: var(--muted);
      font-size: 12px;
    }
    .keys { display: flex; align-items: center; gap: 5px; }
    kbd {
      min-width: 23px;
      padding: 4px 6px;
      color: #b6c3d6;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 5px;
      font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
      text-align: center;
    }
    .help-copy { text-align: right; }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(2, 40px);
      justify-content: center;
      gap: 6px;
      margin: 16px auto 0;
    }
    .mobile-controls[hidden] { display: none !important; }
    .mobile-controls button {
      display: grid;
      place-items: center;
      color: var(--text);
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 10px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mobile-controls button:active { color: var(--green); border-color: var(--green); }
    .mobile-controls [data-dir="up"] { grid-column: 2; grid-row: 1; }
    .mobile-controls [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .mobile-controls [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .mobile-controls [data-dir="right"] { grid-column: 3; grid-row: 2; }

    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      .game-card { padding: 12px; border-radius: 16px; }
      .mobile-controls { display: grid; }
      .helpbar { font-size: 11px; }
      .help-copy { max-width: 145px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topline">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 8h7a3 3 0 1 1-3 3V8a3 3 0 1 0-3 3h2m11 5h-7a3 3 0 1 1 3-3v3a3 3 0 1 0 3-3h-2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1>Kamal Creation Games</h1>
          <p class="eyebrow">Pick a game and jump in.</p>
        </div>
      </div>
      <div class="status" id="status" data-state="ready" aria-live="polite"><span class="status-dot"></span><span id="statusText">Ready</span></div>
    </header>

    <nav class="game-picker" aria-label="Choose a game">
      <button type="button" data-game="snake" aria-pressed="true">🐍 Snake</button>
      <button type="button" data-game="ttt" aria-pressed="false">✕ Tic-Tac-Toe</button>
      <button type="button" data-game="pong" aria-pressed="false">◉ Pong</button>
    </nav>

    <section class="game-card" id="gameCard" aria-label="Snake game">
      <div class="scorebar">
        <div class="score-block"><span class="score-label">Score</span><span class="score-value" id="score">0</span></div>
        <div class="level" id="level">Level 1</div>
        <div class="score-block"><span class="score-label">Best</span><span class="score-value" id="best">0</span></div>
      </div>
      <div class="board-wrap">
        <canvas id="board" width="480" height="480" role="img" aria-label="Snake game board"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <div class="overlay-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.75v12.5L18 12 8 5.75Z" fill="currentColor"/></svg>
            </div>
            <h2 id="overlayTitle">Ready when you are</h2>
            <p id="overlayMessage">Collect the glowing orbs. Don't run into yourself—or the walls.</p>
            <button class="primary" id="startButton" type="button">Start game</button>
          </div>
        </div>
      </div>
      <div class="helpbar">
        <div class="keys" aria-label="Arrow keys or WASD to move">
          <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd><span>or WASD</span>
        </div>
        <div class="help-copy" id="helpCopy">Space to pause <span aria-hidden="true">·</span> Eat to speed up</div>
      </div>
      <div class="mobile-controls" aria-label="Touch controls">
        <button type="button" data-dir="up" aria-label="Move up">↑</button>
        <button type="button" data-dir="left" aria-label="Move left">←</button>
        <button type="button" data-dir="down" aria-label="Move down">↓</button>
        <button type="button" data-dir="right" aria-label="Move right">→</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const canvas = document.querySelector("#board");
      const ctx = canvas.getContext("2d");
      const scoreNode = document.querySelector("#score");
      const bestNode = document.querySelector("#best");
      const scoreLabel = document.querySelector(".score-block:first-child .score-label");
      const bestLabel = document.querySelector(".score-block:last-child .score-label");
      const levelNode = document.querySelector("#level");
      const status = document.querySelector("#status");
      const statusText = document.querySelector("#statusText");
      const overlay = document.querySelector("#overlay");
      const overlayTitle = document.querySelector("#overlayTitle");
      const overlayMessage = document.querySelector("#overlayMessage");
      const startButton = document.querySelector("#startButton");
      const boardWrap = document.querySelector(".board-wrap");
      const gameCard = document.querySelector("#gameCard");
      const helpCopy = document.querySelector("#helpCopy");
      const mobileControls = document.querySelector(".mobile-controls");
      const cells = 24;
      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      let activeGame = "snake";
      let state = "ready";
      let timer;
      let snake;
      let food;
      let direction;
      let nextDirection;
      let score = 0;
      let best = Number(localStorage.getItem("neon-snake-best")) || 0;
      let board;
      let turn;
      let xWins = 0;
      let oWins = 0;
      let draws = 0;
      let playerScore = 0;
      let cpuScore = 0;
      let playerPaddle;
      let cpuPaddle;
      let ball;
      const held = new Set();

      bestNode.textContent = best;

      function setState(next) {
        state = next;
        status.dataset.state = next;
        statusText.textContent = next === "playing" ? "Playing" : next === "paused" ? "Paused" : next === "over" ? "Game over" : "Ready";
        overlay.hidden = next === "playing";
      }

      function setupGame(game, fresh = true) {
        clearTimeout(timer);
        held.clear();
        activeGame = game;
        state = "ready";
        document.querySelectorAll(".game-picker button").forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.game === game));
        });
        boardWrap.classList.toggle("wide", game === "pong");
        canvas.height = game === "pong" ? 360 : 480;
        if (game === "snake") {
          gameCard.setAttribute("aria-label", "Snake game");
          scoreLabel.textContent = "Score";
          bestLabel.textContent = "Best";
          scoreNode.textContent = "0";
          bestNode.textContent = best;
          levelNode.textContent = "Level 1";
          helpCopy.innerHTML = 'Space to pause <span aria-hidden="true">·</span> Eat to speed up';
          mobileControls.hidden = false;
          overlayTitle.textContent = "Ready when you are";
          overlayMessage.textContent = "Collect the glowing orbs. Don't run into yourself—or the walls.";
          startButton.textContent = "Start game";
          resetSnake();
        } else if (game === "ttt") {
          gameCard.setAttribute("aria-label", "Tic-Tac-Toe game");
          scoreLabel.textContent = "X wins";
          bestLabel.textContent = "O wins";
          scoreNode.textContent = xWins;
          bestNode.textContent = oWins;
          levelNode.textContent = `Draws ${draws}`;
          helpCopy.textContent = "Two players · Click a square";
          mobileControls.hidden = true;
          overlayTitle.textContent = "Three in a row";
          overlayMessage.textContent = "Challenge a friend on the same screen. X takes the first turn.";
          startButton.textContent = "Let's play";
          resetTicTacToe();
        } else {
          gameCard.setAttribute("aria-label", "Pong game");
          scoreLabel.textContent = "You";
          bestLabel.textContent = "CPU";
          scoreNode.textContent = "0";
          bestNode.textContent = "0";
          levelNode.textContent = "First to 5";
          helpCopy.textContent = "W / S or ↑ / ↓ to move";
          mobileControls.hidden = false;
          overlayTitle.textContent = "Ready to rally?";
          overlayMessage.textContent = "Keep the ball in play and beat the CPU to five.";
          startButton.textContent = "Start match";
          if (fresh) {
            playerScore = 0;
            cpuScore = 0;
          }
          resetPong();
        }
        setState("ready");
      }

      function resetSnake() {
        snake = [{ x: 11, y: 12 }, { x: 10, y: 12 }, { x: 9, y: 12 }];
        direction = directions.right;
        nextDirection = direction;
        score = 0;
        food = placeFood();
        if (activeGame === "snake") {
          scoreNode.textContent = score;
          levelNode.textContent = `Level ${Math.floor(score / 5) + 1}`;
        }
        drawSnake();
      }

      function placeFood() {
        let point;
        do {
          point = { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
        } while (snake.some(segment => segment.x === point.x && segment.y === point.y));
        return point;
      }

      function tickDelay() {
        return Math.max(62, 145 - Math.floor(score / 3) * 9);
      }

      function start() {
        if (activeGame === "snake") {
          if (state === "ready" || state === "over") resetSnake();
          setState("playing");
          clearTimeout(timer);
          timer = setTimeout(tickSnake, tickDelay());
        } else if (activeGame === "pong") {
          if (state === "over") {
            playerScore = 0;
            cpuScore = 0;
            scoreNode.textContent = "0";
            bestNode.textContent = "0";
          }
          if (state === "ready" || state === "over") resetPong();
          setState("playing");
          clearTimeout(timer);
          timer = setTimeout(tickPong, 16);
        } else {
          if (state === "over") resetTicTacToe();
          drawTicTacToe();
          setState("playing");
        }
      }

      function tickSnake() {
        if (state !== "playing" || activeGame !== "snake") return;
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        const ate = head.x === food.x && head.y === food.y;
        const body = ate ? snake : snake.slice(0, -1);
        if (head.x < 0 || head.x >= cells || head.y < 0 || head.y >= cells ||
            body.some(segment => segment.x === head.x && segment.y === head.y)) {
          finishSnake();
          return;
        }
        snake.unshift(head);
        if (ate) {
          score += 1;
          scoreNode.textContent = score;
          levelNode.textContent = `Level ${Math.floor(score / 5) + 1}`;
          if (score > best) {
            best = score;
            bestNode.textContent = best;
            localStorage.setItem("neon-snake-best", String(best));
          }
          food = placeFood();
        } else {
          snake.pop();
        }
        drawSnake();
        timer = setTimeout(tickSnake, tickDelay());
      }

      function finishSnake() {
        clearTimeout(timer);
        setState("over");
        overlayTitle.textContent = "Game over";
        overlayMessage.textContent = `You scored ${score}. Ready for another run?`;
        startButton.textContent = "Play again";
      }

      function setDirection(name) {
        const candidate = directions[name];
        if (!candidate || state !== "playing") return;
        if (candidate.x + direction.x === 0 && candidate.y + direction.y === 0) return;
        nextDirection = candidate;
      }

      function drawSnake() {
        const size = canvas.width / cells;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#090e17";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawGrid(size);
        const fx = (food.x + .5) * size;
        const fy = (food.y + .5) * size;
        ctx.save();
        ctx.shadowColor = "#ff5fba";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#ff5fba";
        ctx.beginPath();
        ctx.arc(fx, fy, size * .31, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#fff";
        ctx.globalAlpha = .8;
        ctx.beginPath();
        ctx.arc(fx - 2, fy - 2, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        snake.forEach((segment, index) => {
          const inset = index === 0 ? 2 : 2.5;
          ctx.save();
          ctx.shadowColor = "#81ffb3";
          ctx.shadowBlur = index === 0 ? 15 : 5;
          ctx.fillStyle = index === 0 ? "#a4ffc9" : `rgba(94, 243, 157, ${Math.max(.5, 1 - index * .035)})`;
          roundedRect(ctx, segment.x * size + inset, segment.y * size + inset, size - inset * 2, size - inset * 2, index === 0 ? 6 : 4);
          ctx.fill();
          ctx.restore();
        });
        const head = snake[0];
        const eyeX = head.x * size + size / 2;
        const eyeY = head.y * size + size / 2;
        const forward = direction.x ? { x: direction.x * 3, y: 0 } : { x: 0, y: direction.y * 3 };
        const side = direction.x ? { x: 0, y: 4 } : { x: 4, y: 0 };
        ctx.fillStyle = "#0b1a13";
        for (const sign of [-1, 1]) {
          ctx.beginPath();
          ctx.arc(eyeX + forward.x + side.x * sign, eyeY + forward.y + side.y * sign, 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawGrid(size) {
        ctx.strokeStyle = "#ffffff0a";
        ctx.lineWidth = 1;
        for (let i = 1; i < cells; i++) {
          const pos = i * size + .5;
          ctx.beginPath();
          ctx.moveTo(pos, 0);
          ctx.lineTo(pos, canvas.height);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, pos);
          ctx.lineTo(canvas.width, pos);
          ctx.stroke();
        }
      }

      function resetTicTacToe() {
        board = Array(9).fill("");
        turn = "X";
        drawTicTacToe();
      }

      function drawTicTacToe() {
        const size = canvas.width / 3;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#090e17";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#314054";
        ctx.lineWidth = 3;
        ctx.lineCap = "round";
        for (let i = 1; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(i * size, 56);
          ctx.lineTo(i * size, canvas.height - 56);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(56, i * size);
          ctx.lineTo(canvas.width - 56, i * size);
          ctx.stroke();
        }
        board.forEach((mark, index) => {
          if (!mark) return;
          const x = (index % 3 + .5) * size;
          const y = (Math.floor(index / 3) + .5) * size;
          ctx.save();
          ctx.strokeStyle = mark === "X" ? "#81ffb3" : "#ff5fba";
          ctx.shadowColor = ctx.strokeStyle;
          ctx.shadowBlur = 18;
          ctx.lineWidth = 12;
          ctx.lineCap = "round";
          if (mark === "X") {
            ctx.beginPath();
            ctx.moveTo(x - 42, y - 42);
            ctx.lineTo(x + 42, y + 42);
            ctx.moveTo(x + 42, y - 42);
            ctx.lineTo(x - 42, y + 42);
            ctx.stroke();
          } else {
            ctx.beginPath();
            ctx.arc(x, y, 48, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        });
      }

      function playTicTacToe(event) {
        if (activeGame !== "ttt" || state !== "playing") return;
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * canvas.width / rect.width;
        const y = (event.clientY - rect.top) * canvas.height / rect.height;
        const col = Math.min(2, Math.floor(x / (canvas.width / 3)));
        const row = Math.min(2, Math.floor(y / (canvas.height / 3)));
        const index = row * 3 + col;
        if (board[index]) return;
        board[index] = turn;
        drawTicTacToe();
        const winner = getWinner();
        if (winner) {
          if (winner === "X") xWins++;
          else oWins++;
          scoreNode.textContent = xWins;
          bestNode.textContent = oWins;
          finishTicTacToe(`${winner} wins!`, `${winner} got three in a row. Rematch?`);
        } else if (board.every(Boolean)) {
          draws++;
          levelNode.textContent = `Draws ${draws}`;
          finishTicTacToe("It's a draw!", "Nobody got three in a row. Play again?");
        } else {
          turn = turn === "X" ? "O" : "X";
        }
      }

      function getWinner() {
        const lines = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
        for (const [a, b, c] of lines) {
          if (board[a] && board[a] === board[b] && board[a] === board[c]) return board[a];
        }
        return "";
      }

      function finishTicTacToe(title, message) {
        setState("over");
        overlayTitle.textContent = title;
        overlayMessage.textContent = message;
        startButton.textContent = "New round";
      }

      function resetPong() {
        playerPaddle = { x: 22, y: canvas.height / 2 - 35, w: 9, h: 70 };
        cpuPaddle = { x: canvas.width - 31, y: canvas.height / 2 - 35, w: 9, h: 70 };
        ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 4, vy: 2.4, r: 7 };
        drawPong();
      }

      function tickPong() {
        if (state !== "playing" || activeGame !== "pong") return;
        const move = held.has("up") ? -6 : held.has("down") ? 6 : 0;
        playerPaddle.y = clamp(playerPaddle.y + move, 8, canvas.height - playerPaddle.h - 8);
        const target = ball.y - cpuPaddle.h / 2;
        cpuPaddle.y = clamp(cpuPaddle.y + clamp(target - cpuPaddle.y, -3.4, 3.4), 8, canvas.height - cpuPaddle.h - 8);
        ball.x += ball.vx;
        ball.y += ball.vy;
        if (ball.y - ball.r <= 4 || ball.y + ball.r >= canvas.height - 4) ball.vy *= -1;
        if (ball.vx < 0 && ball.x - ball.r <= playerPaddle.x + playerPaddle.w &&
            ball.y >= playerPaddle.y && ball.y <= playerPaddle.y + playerPaddle.h) {
          bouncePong(playerPaddle);
        } else if (ball.vx > 0 && ball.x + ball.r >= cpuPaddle.x &&
            ball.y >= cpuPaddle.y && ball.y <= cpuPaddle.y + cpuPaddle.h) {
          bouncePong(cpuPaddle);
        }
        if (ball.x < -ball.r) {
          cpuScore++;
          bestNode.textContent = cpuScore;
          if (cpuScore >= 5) {
            finishPong(false);
            return;
          }
          resetPong();
        } else if (ball.x > canvas.width + ball.r) {
          playerScore++;
          scoreNode.textContent = playerScore;
          if (playerScore >= 5) {
            finishPong(true);
            return;
          }
          resetPong();
        }
        drawPong();
        timer = setTimeout(tickPong, 16);
      }

      function bouncePong(paddle) {
        const relative = (ball.y - (paddle.y + paddle.h / 2)) / (paddle.h / 2);
        const speed = Math.min(8, Math.hypot(ball.vx, ball.vy) + .25);
        ball.vx = (paddle === playerPaddle ? 1 : -1) * speed * .88;
        ball.vy = clamp(relative, -1, 1) * speed * .72;
        ball.x = paddle === playerPaddle ? paddle.x + paddle.w + ball.r : paddle.x - ball.r;
      }

      function finishPong(won) {
        clearTimeout(timer);
        setState("over");
        overlayTitle.textContent = won ? "You win!" : "CPU wins";
        overlayMessage.textContent = `Final score: ${playerScore}–${cpuScore}. ${won ? "Great rally!" : "Run it back?"}`;
        startButton.textContent = "Play again";
      }

      function drawPong() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#090e17";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.setLineDash([9, 11]);
        ctx.strokeStyle = "#ffffff20";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 16);
        ctx.lineTo(canvas.width / 2, canvas.height - 16);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#81ffb3";
        ctx.shadowColor = "#81ffb3";
        ctx.shadowBlur = 14;
        roundedRect(ctx, playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h, 5);
        ctx.fill();
        ctx.fillStyle = "#ff5fba";
        ctx.shadowColor = "#ff5fba";
        roundedRect(ctx, cpuPaddle.x, cpuPaddle.y, cpuPaddle.w, cpuPaddle.h, 5);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fillStyle = "#edf4ff";
        ctx.shadowColor = "#edf4ff";
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      function drawIdlePong() {
        resetPong();
      }

      function togglePause() {
        if (state === "playing") {
          clearTimeout(timer);
          setState("paused");
          overlayTitle.textContent = "Take a breather";
          overlayMessage.textContent = "Your game is paused. Jump back in when you're ready.";
          startButton.textContent = "Resume";
        } else if (state === "paused") {
          start();
        }
      }

      function roundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.roundRect(x, y, width, height, radius);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      document.querySelectorAll(".game-picker button").forEach(button => {
        button.addEventListener("click", () => setupGame(button.dataset.game));
      });

      document.addEventListener("keydown", event => {
        const keys = {
          ArrowUp: "up", w: "up", W: "up",
          ArrowDown: "down", s: "down", S: "down",
          ArrowLeft: "left", a: "left", A: "left",
          ArrowRight: "right", d: "right", D: "right"
        };
        if (activeGame === "pong" && (keys[event.key] === "up" || keys[event.key] === "down")) {
          event.preventDefault();
          held.add(keys[event.key]);
        } else if (activeGame === "snake" && keys[event.key]) {
          event.preventDefault();
          setDirection(keys[event.key]);
        } else if (event.code === "Space" && activeGame !== "ttt") {
          event.preventDefault();
          if (state === "ready" || state === "over") start();
          else togglePause();
        }
      });

      document.addEventListener("keyup", event => {
        const key = { ArrowUp: "up", w: "up", W: "up", ArrowDown: "down", s: "down", S: "down" }[event.key];
        if (key) held.delete(key);
      });

      canvas.addEventListener("pointerdown", playTicTacToe);
      mobileControls.querySelectorAll("button").forEach(button => {
        button.addEventListener("pointerdown", event => {
          if (activeGame === "snake") setDirection(button.dataset.dir);
          else if (activeGame === "pong") {
            event.preventDefault();
            held.add(button.dataset.dir);
          }
        });
        button.addEventListener("pointerup", () => held.delete(button.dataset.dir));
        button.addEventListener("pointerleave", () => held.delete(button.dataset.dir));
        button.addEventListener("pointercancel", () => held.delete(button.dataset.dir));
      });

      startButton.addEventListener("click", start);
      setupGame("snake");
    })();
  </script>
</body>
</html>
